services:
  faster-whisper:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: faster-whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:10300:10300"
    environment:
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
      - UVICORN_HOST=127.0.0.1  # bind inside container to loopback only
      - UVICORN_PORT=10300
      - PRELOAD_MODELS=["Systran/faster-whisper-large-v3"]
    volumes:
      - faster-whisper-models:/home/ubuntu/.cache/huggingface

volumes:
  faster-whisper-models:
